<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Stackly Water Technology</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved.">
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .error-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 60px 0;
      background: radial-gradient(circle at 10% 20%, #0e294e 0%, #03045e 100%);
      color: #fff;
    }
    .error-card {
      width: 100%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 50px 40px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 5;
    }
    .error-code {
      font-size: 6rem;
      font-family: var(--font-heading);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(120deg, var(--secondary), #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }
    .error-card h2 {
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .error-card p {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 36px;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Canvas -->
  <canvas id="cursor-canvas"></canvas>

  <!-- Preloader Screen -->
  <div id="site-preloader" class="site-preloader">
    <div class="preloader-droplet-wrapper">
      <div class="preloader-droplet"></div>
      <div class="preloader-pool"></div>
      <div class="preloader-ripple"></div>
    </div>
    <div class="preloader-logo">Stack<span>ly</span></div>
    <div class="preloader-bar"><span></span></div>
  </div>



  <!-- 404 Section with Canvas Background -->
  <section class="error-section">
    <canvas id="hero-bg-canvas" class="hero-bg-canvas"></canvas>
    
    <div class="error-card reveal">
      <div class="error-code">404</div>
      <h2>Page Flow Disrupted</h2>
      <p>The connection path you are attempting to access does not exist or has been rerouted to a different node.</p>
      
      <div class="error-actions">
        <button onclick="window.history.back()" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return Home</a>
      </div>
    </div>
  </section>



  <script src="app.js"></script>
</body>
</html>
