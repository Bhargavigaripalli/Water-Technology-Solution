<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Stackly Water Technology</title>
  <meta name="description" content="Access Stackly's IoT telemetry monitoring system, view purifier flow data, and manage plant maintenance cycles.">
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    /* Custom page-specific styling for Auth layout */
    .auth-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 60px 0;
      background: radial-gradient(circle at 10% 20%, #0e294e 0%, #03045e 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 5;
    }
    .auth-logo-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-logo-wrap img {
      height: 48px;
      width: auto;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .auth-header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .form-group-standard {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
    }
    .form-label-standard {
      display: block;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-input-standard {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.98rem;
      outline: none;
      transition: var(--transition-fast);
    }
    .form-input-standard:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }
    select.form-input-standard option {
      background-color: #111827;
      color: #cbd5e1;
    }
    .password-toggle-box {
      position: relative;
    }
    .password-toggle-box .password-toggle {
      position: absolute;
      right: 16px;
      top: 15px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      z-index: 10;
    }
    .auth-actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      cursor: pointer;
    }
    .forgot-link {
      color: var(--secondary);
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .auth-footer-text {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 0.92rem;
    }
    .auth-footer-text a {
      color: var(--secondary);
      font-weight: 700;
    }
    .auth-footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Canvas -->
  <canvas id="cursor-canvas"></canvas>

  <!-- Preloader Screen -->
  <div id="site-preloader" class="site-preloader">
    <div class="preloader-droplet-wrapper">
      <div class="preloader-droplet"></div>
      <div class="preloader-pool"></div>
      <div class="preloader-ripple"></div>
    </div>
    <div class="preloader-logo">Stack<span>ly</span></div>
    <div class="preloader-bar"><span></span></div>
  </div>

  <!-- Login Section with Floating Canvas Background -->
  <section class="auth-section">
    <canvas id="hero-bg-canvas" class="hero-bg-canvas"></canvas>
    
    <div class="auth-card reveal">
      <div style="margin-bottom: 20px; text-align: left; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="color: var(--secondary); font-weight: 600; font-size: 0.92rem; display: inline-flex; align-items: center; gap: 8px;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
      </div>

      <div class="auth-logo-wrap">
        <a href="index.html">
          <img src="assets/logo.webp" alt="Stackly Logo">
        </a>
      </div>

      <div class="auth-header">
        <h2>Client Login</h2>
        <p>Access your plant telemetry dashboard</p>
      </div>

      <form id="login-form">
        <div class="form-group-standard">
          <label for="login-email" class="form-label-standard">Work Email</label>
          <input type="email" id="login-email" class="form-input-standard" placeholder="E.g., operator@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" title="Gmail address ending in @gmail.com only" required autocomplete="email">
        </div>

        <div class="form-group-standard">
          <label for="login-password" class="form-label-standard">Password</label>
          <div class="password-toggle-box">
            <input type="password" id="login-password" class="form-input-standard" placeholder="Enter strong password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*(),.?&quot;:{}|<>]).{8,}" title="Must contain at least 8 characters, one number, one uppercase, one lowercase, and one special character" required autocomplete="current-password">
            <i class="fa-solid fa-eye-slash password-toggle" id="password-toggle-btn"></i>
          </div>
        </div>

        <div class="form-group-standard" style="margin-bottom: 24px;">
          <label for="login-role" class="form-label-standard">Portal Access Mode</label>
          <div style="position: relative;">
            <select id="login-role" class="form-input-standard" style="appearance: none; padding-right: 40px;" required>
              <option value="user">User Dashboard</option>
              <option value="admin">Admin Dashboard</option>
            </select>
            <i class="fa-solid fa-chevron-down" style="position: absolute; right: 16px; top: 16px; color: #94a3b8; pointer-events: none;"></i>
          </div>
        </div>

        <div class="auth-actions-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember-me"> Remember Me
          </label>
          <a href="404.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;"><i class="fa-solid fa-right-to-bracket"></i> Log In to Portal</button>
      </form>

      <p class="auth-footer-text">
        Need plant telemetry access? <a href="create-account.html">Get Started</a>
      </p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
